        function memoize(fn) {
            let memoized = [];
            return function (...args) {
                const key = JSON.stringify([...args]);
                if (memoized[key]) {
                    return memoized[key];
                }

                const result = fn(...args);
                memoized[key] = result;
                return result;
            }
        }

        let callCount = 0;
        const memoizedFn = memoize(function (a, b) {
            callCount += 1;
            return a + b;
        })
        console.log(memoizedFn(2, 3)) // 5
        console.log(memoizedFn(2, 3)) // 5
        console.log(callCount) // 1
