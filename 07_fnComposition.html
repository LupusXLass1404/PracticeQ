<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        var compose = function (fn) {
            return function (x) {
                let tmp = x;
                for (i = fn.length - 1; i >= 0; i--) {
                    console.log(i);
                    tmp = (fn[i](tmp));
                }

                return tmp;
            }
        };

        const fn = compose([x => 10 * x, x => 10 * x, x => 10 * x]) // 箭頭fn，所以每個都是一個儲存在陣列裡的fn
        console.log(fn(10))
    </script>
</body>

</html>
